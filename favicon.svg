<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1535"/>
      <stop offset="100%" stop-color="#03050e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="65%" r="40%">
      <stop offset="0%" stop-color="#5bc8ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5bc8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Fond -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <!-- Étoiles -->
  <circle cx="10" cy="12" r="0.9" fill="white" opacity="0.7"/>
  <circle cx="52" cy="8"  r="0.7" fill="white" opacity="0.5"/>
  <circle cx="58" cy="30" r="0.8" fill="white" opacity="0.6"/>
  <circle cx="6"  cy="42" r="0.7" fill="white" opacity="0.4"/>
  <circle cx="48" cy="52" r="0.6" fill="white" opacity="0.5"/>
  <!-- Flamme réacteur -->
  <ellipse cx="32" cy="52" rx="5" ry="10" fill="#1a6fff" opacity="0.5"/>
  <ellipse cx="32" cy="50" rx="3" ry="7"  fill="#5bc8ff" opacity="0.7"/>
  <ellipse cx="32" cy="48" rx="1.5" ry="4" fill="#cceeff" opacity="0.9"/>
  <!-- Corps du vaisseau -->
  <polygon points="32,8 40,38 32,34 24,38" fill="#c8d8f0"/>
  <polygon points="32,8 40,38 32,34 24,38" fill="url(#glow)" opacity="0.4"/>
  <!-- Ailes -->
  <polygon points="24,28 12,44 24,38" fill="#8aaad0"/>
  <polygon points="40,28 52,44 40,38" fill="#8aaad0"/>
  <!-- Cockpit -->
  <ellipse cx="32" cy="20" rx="4" ry="5.5" fill="#1a3a6a"/>
  <ellipse cx="32" cy="19" rx="2.5" ry="3.5" fill="#5bc8ff" opacity="0.8"/>
  <!-- Bord d'attaque lumineux -->
  <line x1="32" y1="8" x2="24" y2="38" stroke="#ddeeff" stroke-width="0.6" opacity="0.5"/>
  <line x1="32" y1="8" x2="40" y2="38" stroke="#ddeeff" stroke-width="0.6" opacity="0.5"/>
</svg>
